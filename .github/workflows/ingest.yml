# Hourly ingest (BRIEF §5.1). Disabled until the repo variable
# PIPELINE_ENABLED is set to "true" after the R2 secrets exist (docs/HUMAN_TODO.md).
name: ingest
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "ISO UTC target time (optional)"
        required: false
concurrency:
  group: media-writer
  cancel-in-progress: false
jobs:
  ingest:
    if: vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORAGE: r2
      SUNSPOTS_DOMAIN: ${{ vars.SUNSPOTS_DOMAIN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.ingest ${{ inputs.target && format('--target {0}', inputs.target) || '' }}
