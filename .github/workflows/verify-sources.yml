# M0: run the source check from a GitHub runner (open network). Manual only.
name: verify-sources
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/verify_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
